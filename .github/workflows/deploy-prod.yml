name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -eu
            cd /opt/jobez/app
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/ali-osaid01/jobez-backend.git
            else
              git remote set-url origin https://github.com/ali-osaid01/jobez-backend.git
            fi
            git fetch --prune origin main
            git checkout -B main origin/main
            git clean -fd
            ./deploy/scripts/deploy.sh
