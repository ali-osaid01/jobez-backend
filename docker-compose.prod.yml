services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt:ro

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    expose:
      - "8000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: .env.prod
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobez}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-jobez}
    volumes:
      - /opt/jobez/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobez} -d ${POSTGRES_DB:-jobez}"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - /opt/jobez/chromadb:/chroma/chroma
    expose:
      - "8000"

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
